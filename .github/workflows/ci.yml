name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.1
  MSRV_VERSION: "1.85.1"
  RUSTDOCFLAGS: "-D warnings"

jobs:
  msrv:
    # The `env` context is not available in a job name (only github, needs,
    # strategy, matrix, vars, inputs), so the MSRV value stays in the steps.
    name: Check MSRV
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust MSRV
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.MSRV_VERSION }}

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-${{ runner.os }}-rust-${{ env.MSRV_VERSION }}
          shared-key: msrv

      - name: Install Cargo Make
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-make@0.37.24

      - name: Check all targets and features on MSRV
        run: cargo make msrv

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
          - name: macOS
            runner: macos-26
          - name: Windows
            runner: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt clippy

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-${{ runner.os }}-rust-${{ env.RUST_VERSION }}
          shared-key: ${{ matrix.name }}

      - name: Install Cargo tools
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-make@0.37.24, cargo-nextest@0.9.146

      - name: Check formatting
        run: cargo make format

      - name: Check all targets and features
        run: cargo make check

      - name: Lint with Clippy (warnings denied)
        run: cargo make clippy

      - name: Run tests
        run: cargo make test

      - name: Build Rust documentation
        run: cargo make doc

      - name: Build release binary
        run: cargo make release

      - name: Verify crate is packageable
        run: cargo make package

      - name: Test the PowerShell installer and PE verifier
        if: runner.os != 'macOS'
        run: |
          cargo make windows-installer-test
          pwsh -NoProfile -File tests/release/verify.ps1

      - name: Install ShellCheck (Linux only)
        if: runner.os == 'Linux'
        env:
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          SHELLCHECK_VERSION: v0.11.0
        run: |
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz" \
            -o "$archive"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          install -m 755 \
            "$RUNNER_TEMP/shellcheck-$SHELLCHECK_VERSION/shellcheck" \
            "$HOME/.local/bin/shellcheck"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check installer shell scripts (Linux only)
        if: runner.os == 'Linux'
        run: cargo make installers-shellcheck

      - name: Test shell tooling (Linux only)
        if: runner.os == 'Linux'
        run: |
          cargo make unix-installer-test
          cargo make release-verification-test

      - name: Test the Unix installer (macOS only)
        if: runner.os == 'macOS'
        run: cargo make unix-installer-test

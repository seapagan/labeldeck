[package]
name = "labeldeck"
version = "0.2.0"
edition = "2024"
# Proven with cargo-msrv and independently verified against the full
# gate (check + tests) on the exact toolchain.
rust-version = "1.88.0"
description = "Export, diff, and safely synchronize GitHub repository labels from a canonical JSON file"
repository = "https://github.com/seapagan/labeldeck"
license = "MIT OR Apache-2.0"
keywords = ["automation", "cli", "github", "labels", "sync"]
categories = ["command-line-utilities"]
include = [
  "CHANGELOG.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
  "README.md",
  "src/**",
  "tests/**",
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
colored_text = "=0.6.0"
crossterm = { version = "=0.29.0", default-features = false, features = ["bracketed-paste", "events", "windows"] }
dirs = "7.0.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
renamore = "0.3.2"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }
tui-input = { version = "=0.15.4", default-features = false, features = ["crossterm"] }
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
parking_lot = "0.12.5"
portable-pty = "=0.9.0"
tempfile = "3.27.0"

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unsafe_code = "deny"
